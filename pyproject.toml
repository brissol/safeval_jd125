[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brissol-safeval_jd125"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出模型安全评测负责人·标注一致性与标注者偏差上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "brissol" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://brissol.github.io"
Repository = "https://github.com/brissol/safeval_jd125"
Issues = "https://github.com/brissol/safeval_jd125/issues"

[project.scripts]
safeval_jd125 = "safeval_jd125:main"

[tool.setuptools]
py-modules = ["safeval_jd125"]
